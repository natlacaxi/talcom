<style>
  :root {
    --paper: #eef3f8;
    --ink: #14171f;
    --muted: #5d6677;
    --idfm: #6bb5e8;
    --talco: #2d1670;
    --azur: #f59b00;
    --ter: #0a70b8;
    --accent: var(--idfm);
    --dh: min(56vh, 480px);
    --size: clamp(124px, 19vw, 210px);
    --sans: "Avenir Next", "Segoe UI Variable", "Trebuchet MS", system-ui, sans-serif;
    --mono: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--paper);
    color: var(--ink);
    font-family: var(--sans);
    overflow: hidden;
  }

  /* Fond : un plan de réseau très discret */
  .plan { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .plan path { fill: none; stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .28; }
  .plan circle { fill: #fff; stroke-width: 4; opacity: .7; }

  header {
    position: fixed; top: 0; left: 0; right: 0; z-index: 3;
    display: flex; justify-content: space-between; align-items: flex-start; gap: 16px;
    padding: 20px clamp(16px, 4vw, 40px);
    pointer-events: none;
  }
  h1 { margin: 0; font-size: clamp(1.15rem, 2.4vw, 1.6rem); font-weight: 700; letter-spacing: -.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: .95rem; }
  .status {
    pointer-events: auto;
    display: inline-flex; align-items: center; gap: 8px;
    padding: 7px 12px; border-radius: 999px;
    background: #fff; color: var(--muted); font-size: .85rem;
    box-shadow: 0 1px 0 rgba(20, 23, 31, .08);
    white-space: nowrap;
  }
  .status i { width: 9px; height: 9px; border-radius: 50%; background: #b8c0cc; }
  .status.on i { background: #1fa971; }
  .status.off i { background: var(--azur); }

  /* Les quatre logos */
  #stage { position: fixed; inset: 0; z-index: 1; display: grid; place-items: center; }
  #logos {
    display: grid; grid-template-columns: repeat(4, var(--size));
    gap: clamp(14px, 3vw, 34px);
  }
  @media (max-width: 760px) { #logos { grid-template-columns: repeat(2, var(--size)); } }
  .slot { width: var(--size); height: var(--size); }

  .logo {
    --sx: 0; --sy: 0; --sr: 0deg;
    position: relative; display: block; width: 100%; height: 100%;
    padding: 14px; border: 0; border-radius: 26px; background: #fff; cursor: pointer;
    box-shadow: 0 0 0 2px transparent, 0 10px 28px rgba(20, 23, 31, .12);
    transition: transform .8s cubic-bezier(.2, .8, .2, 1), opacity .45s, filter .45s, box-shadow .45s;
    animation: fly 1.15s cubic-bezier(.2, .9, .25, 1.1) backwards;
    animation-delay: calc(var(--i) * .16s + .15s);
  }
  .logo img { width: 100%; height: 100%; object-fit: contain; display: block; pointer-events: none; }
  .logo[data-from="left"]   { --sx: -115vw; --sr: -16deg; }
  .logo[data-from="right"]  { --sx: 115vw;  --sr: 16deg; }
  .logo[data-from="top"]    { --sy: -115vh; --sr: 10deg; }
  .logo[data-from="bottom"] { --sy: 115vh;  --sr: -10deg; }
  @keyframes fly {
    from { transform: translate(var(--sx), var(--sy)) rotate(var(--sr)) scale(.8); }
    to   { transform: none; }
  }
  .logo.ready:not(.active):hover { transform: translateY(-6px); }
  .logo:focus-visible { outline: 3px solid var(--ink); outline-offset: 4px; }
  .logo.active {
    z-index: 6;
    box-shadow: 0 0 0 3px var(--accent), 0 24px 60px rgba(20, 23, 31, .28);
  }
  .logo.dim { opacity: .2; filter: grayscale(1); }

  /* Tiroir de code */
  #drawer {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5;
    height: var(--dh);
    display: flex; flex-direction: column;
    background: #12151d; color: #d9deea;
    border-top: 4px solid var(--accent);
    border-radius: 22px 22px 0 0;
    transform: translateY(105%);
    transition: transform .7s cubic-bezier(.2, .8, .2, 1);
  }
  #drawer.open { transform: none; }
  .bar {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 10px 14px 0; border-bottom: 1px solid #262b38;
  }
  .tabs { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
  .tab {
    border: 0; background: transparent; color: #8d96aa; font: 500 .85rem var(--mono);
    padding: 9px 12px; border-radius: 8px 8px 0 0; cursor: pointer; white-space: nowrap;
  }
  .tab[aria-selected="true"] { color: #fff; background: #1b2030; box-shadow: inset 0 -2px 0 var(--accent); }
  .tab:focus-visible, .act:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
  .actions { display: flex; gap: 6px; padding-bottom: 6px; }
  .act {
    border: 1px solid #323849; background: transparent; color: #d9deea;
    font: 500 .82rem var(--sans); padding: 6px 12px; border-radius: 8px; cursor: pointer;
  }
  .act:hover { background: #1b2030; }
  .meta { padding: 8px 18px 0; color: #77809a; font: .78rem var(--mono); }
  #view { flex: 1; overflow: auto; margin: 0; padding: 8px 0 24px; counter-reset: n; tab-size: 2; }
  #code { display: block; font: .82rem/1.6 var(--mono); }
  .l { display: block; min-height: 1.6em; padding-right: 24px; white-space: pre; counter-increment: n; }
  .l::before {
    content: counter(n); display: inline-block; width: 3.6em; margin-right: 1.2em;
    text-align: right; color: #4c566e; user-select: none;
  }

  @media (prefers-reduced-motion: reduce) {
    .logo { animation: none; }
    .logo, #drawer { transition-duration: .01s; }
  }
</style>
</head>

#!/usr/bin/env python3
"""Back-end minimal : sert le front et relaie l'API PRIM (Île-de-France Mobilités).

La clé reste côté serveur (variable d'environnement), jamais dans le navigateur.
Lancement :  PRIM_API_KEY=xxxxx python3 server.py   puis  http://localhost:8000
"""
import json
import os
import urllib.error
import urllib.parse
import urllib.request
from http.server import SimpleHTTPRequestHandler, ThreadingHTTPServer

PRIM_BASE = "https://prim.iledefrance-mobilites.fr/marketplace"
PRIM_KEY = os.environ.get("PRIM_API_KEY", "")
PORT = int(os.environ.get("PORT", "8000"))


class Handler(SimpleHTTPRequestHandler):
    def _json(self, status, payload):
        body = json.dumps(payload).encode("utf-8")
        self.send_response(status)
        self.send_header("Content-Type", "application/json; charset=utf-8")
        self.send_header("Content-Length", str(len(body)))
        self.end_headers()
        self.wfile.write(body)

    def do_GET(self):
        url = urllib.parse.urlparse(self.path)

        if url.path == "/api/health":
            return self._json(200, {"ok": True, "prim_key": bool(PRIM_KEY)})

        if url.path == "/api/prochains":
            stop = urllib.parse.parse_qs(url.query).get("stop", [""])[0]
            if not stop:
                return self._json(400, {"error": "paramètre 'stop' manquant"})
            if not PRIM_KEY:
                return self._json(500, {"error": "PRIM_API_KEY non définie"})

            query = urllib.parse.urlencode({"MonitoringRef": stop})
            req = urllib.request.Request(
                f"{PRIM_BASE}/stop-monitoring?{query}",
                headers={"apikey": PRIM_KEY, "Accept": "application/json"},
            )
            try:
                with urllib.request.urlopen(req, timeout=10) as resp:
                    return self._json(200, json.load(resp))
            except urllib.error.HTTPError as err:
                # 401 = clé refusée : vérifier la clé et l'en-tête « apikey »
                return self._json(err.code, {"error": f"PRIM HTTP {err.code}"})
            except Exception as err:  # réseau, timeout, JSON invalide
                return self._json(502, {"error": str(err)})

        return super().do_GET()  # fichiers statiques (index.html...)


if __name__ == "__main__":
    print(f"Serveur sur http://localhost:{PORT}  (clé PRIM : {'oui' if PRIM_KEY else 'non'})")
    ThreadingHTTPServer(("", PORT), Handler).serve_forever()
</script>

name: Déploiement GitHub Pages

on:

    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages

      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5

        with:
          path: .
      - id: deployment

<script id="app">
// Copie du HTML tel qu'il est au chargement (repli si le fichier est ouvert hors serveur)
const SELF = '<!DOCTYPE html>\n' + document.documentElement.outerHTML;

const $ = (id) => document.getElementById(id);
const logos = [...document.querySelectorAll('.logo')];
const drawer = $('drawer');
let active = null;
let current = 'html';

/* ---------- Animation d'arrivée : chaque logo vient de son côté ---------- */
logos.forEach((el) => el.addEventListener('animationend', () => el.classList.add('ready'), { once: true }));

/* ---------- Placement : le logo cliqué se centre ---------- */
function place(card) {
  const slot = card.parentElement.getBoundingClientRect();   // position naturelle
  const dh = drawer.offsetHeight;
  const freeH = innerHeight - dh;
  const cx = innerWidth / 2;
  const cy = Math.max(freeH / 2, 130) + 28;
  const scale = Math.max(.7, Math.min(1.35, (freeH - 130) / slot.height, (innerWidth * .8) / slot.width));
  const dx = cx - (slot.left + slot.width / 2);
  const dy = cy - (slot.top + slot.height / 2);
  card.style.transform = `translate(${dx}px, ${dy}px) scale(${scale})`;
}

function openFor(card) {
  if (active && active !== card) active.style.transform = '';
  active = card;
  logos.forEach((el) => {
    el.classList.toggle('active', el === card);
    el.classList.toggle('dim', el !== card);
  });
  drawer.style.setProperty('--accent', card.dataset.accent);
  document.documentElement.style.setProperty('--accent', card.dataset.accent);
  drawer.classList.add('open');
  drawer.setAttribute('aria-hidden', 'false');
  place(card);
  show(current);
}

function closeAll() {
  if (!active) return;
  active.style.transform = '';
  active = null;
  logos.forEach((el) => el.classList.remove('active', 'dim'));
  drawer.classList.remove('open');
  drawer.setAttribute('aria-hidden', 'true');
}

logos.forEach((card) => card.addEventListener('click', () => (card === active ? closeAll() : openFor(card))));
$('close').addEventListener('click', closeAll);
addEventListener('keydown', (e) => { if (e.key === 'Escape') closeAll(); });
addEventListener('resize', () => active && place(active));

/* ---------- Visionneuse : le HTML du site dans le HTML, puis js, py, yaml ---------- */
async function getHtml() {
  if (/^https?:/.test(location.protocol)) {
    try {
      const r = await fetch(location.href, { cache: 'no-store' });
      if (r.ok) return await r.text();
    } catch (e) { /* on retombe sur la copie */ }
  }
  return SELF;
}
const clean = (id) => $(id).textContent.replace(/^\n/, '').replace(/\n$/, '');

const FILES = [
  { id: 'html', name: 'index.html', get: getHtml },
  { id: 'js', name: 'app.js', get: () => clean('app') },
  { id: 'py', name: 'server.py', get: () => clean('src-py') },
  { id: 'yaml', name: 'deploy.yml', path: '.github/workflows/deploy.yml', get: () => clean('src-yaml') },
];

const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
// Les images embarquées (base64) rendraient le code illisible : on les abrège à l'affichage
const shorten = (s) => s.replace(/(data:image\/[a-z]+;base64,)[A-Za-z0-9+\/=]{60,}/g, '$1…[image tronquée]');

let raw = '';
async function show(id) {
  current = id;
  const file = FILES.find((f) => f.id === id);
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.id === id)));
  raw = await file.get();
  const lines = shorten(raw).split('\n');
  $('code').innerHTML = lines.map((l) => `<span class="l">${esc(l)}</span>`).join('');
  $('meta').textContent = `${file.path || file.name}  –  ${lines.length} lignes`;
  $('view').scrollTop = 0;
}

FILES.forEach((f) => {
  const b = document.createElement('button');
  b.className = 'tab'; b.type = 'button'; b.dataset.id = f.id; b.textContent = f.name;
  b.setAttribute('role', 'tab');
  b.addEventListener('click', () => show(f.id));
  $('tabs').appendChild(b);
});

$('copy').addEventListener('click', async () => {
  const btn = $('copy');
  try { await navigator.clipboard.writeText(raw); btn.textContent = 'Copié'; }
  catch (e) { btn.textContent = 'Copie impossible'; }
  setTimeout(() => (btn.textContent = 'Copier'), 1600);
});

/* ---------- État du back-end (server.py) ---------- */

    const ctl = new AbortController();
    setTimeout(() => ctl.abort(), 2500);
    const r = await fetch('/api/health', { signal: ctl.signal });
    const j = await r.json();
    box.classList.add('on');
    label.textContent = j.prim_key ? 'Back-end en ligne, clé PRIM présente' : 'Back-end en ligne, clé PRIM absente';
  } catch (e) {
    box.classList.add('off');
    label.textContent = 'Mode statique : back-end hors ligne';
  }
})();
</script>
